<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello World — Hao</title>
<meta name="description" content="Hello World">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg:#0a0a12; --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.09);
  --text:#f2f3f8; --dim:#9a9db1; --faint:#63667d;
  --a1:#6366f1; --a2:#a855f7;
  --font:"SF Pro Display","Inter",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.8;-webkit-font-smoothing:antialiased}
::selection{background:rgba(99,102,241,.35);color:#fff}
.bg{position:fixed;inset:0;z-index:-2;background:radial-gradient(60rem 40rem at 15% -10%,rgba(99,102,241,.14),transparent 60%),radial-gradient(50rem 35rem at 85% 10%,rgba(168,85,247,.10),transparent 60%),var(--bg)}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);background:rgba(10,10,18,.55);border-bottom:1px solid var(--border)}
.nav-inner{max-width:760px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-weight:700;font-size:17px;background:linear-gradient(120deg,#38bdf8,var(--a1) 55%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
.nav-links a{color:var(--dim);text-decoration:none;font-size:14px;transition:color .3s}
.nav-links a:hover{color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
article{padding:140px 0 100px}
.post-title{font-size:clamp(28px,4.5vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.post-meta{display:flex;gap:16px;margin:18px 0 40px;font-family:var(--mono);font-size:13px;color:var(--faint)}
.post-body{color:#d7d9e6;font-size:16px}
.post-body p{margin-bottom:1.4em}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--dim);text-decoration:none;font-size:14px;transition:color .3s}
.back:hover{color:var(--text)}
.back:hover .arr{transform:translateX(-3px)}
.arr{transition:transform .3s}
footer{border-top:1px solid var(--border);padding:36px 0 50px;color:var(--faint);font-size:13.5px}
.foot{max-width:760px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="bg"></div>
<nav class="nav"><div class="nav-inner">
  <a class="nav-logo" href="/">Hao</a>
  <div class="nav-links"><a href="/#projects">项目</a><a href="/#blog">博客</a></div>
</div></nav>
<article class="wrap">
  <a class="back" href="/#blog"><span class="arr">←</span> 返回主页</a>
  <h1 class="post-title">Hello World</h1>
  <div class="post-meta"><span>2022.07.28</span><span>tag: test</span></div>
  <div class="post-body">
    <p>Welcome！</p>
    <p>这是博客的第一篇文章，标志着这个小站的诞生。</p>
    <p>Share · 记录 · 成长。</p>
  </div>
</article>
<footer><div class="foot">
  <span>© 2022–2026 Hao</span>
  <a href="/">← 回到主页</a>
</div></footer>
</body>
</html>
